name: vrt
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# reg-publish-github-plugin stores snapshots as assets on a prerelease, and
# reg-notify-github-plugin posts the PR comment / commit status.
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  vrt:
    name: VRT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Check out the PR head branch from its head repo so fork PRs whose
          # branch is named `main` don't resolve against the base repo. Use the
          # branch name (not SHA) so reg-keygen sees HEAD attached to a branch
          # rather than detached — it errors otherwise.
          ref: ${{ github.head_ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # reg-keygen walks git history to find the base commit — needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Install Playwright (Chromium, software rendering)
        run: npx playwright install --with-deps chromium
      - name: Build Storybook
        run: npm run storybook:build:vrt
      - name: Capture screenshots
        run: npm run vrt:capture
      - name: Run reg-suit
        run: npm run vrt:run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REG_NOTIFY_CLIENT_ID: ${{ vars.REG_NOTIFY_CLIENT_ID }}
          # Pin snapshots published from main so the retentionCount cap never
          # evicts a baseline; PR snapshots stay ephemeral and churn within it.
          REG_PUBLISH_PROTECTED: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload reg-suit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reg-report
          path: .reg/**
          # `.reg` is a dotfile dir, so its contents count as hidden files.
          include-hidden-files: true
          if-no-files-found: ignore
