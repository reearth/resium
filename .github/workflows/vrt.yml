name: vrt
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# reg-publish-github-plugin stores snapshots as assets on a prerelease, and
# reg-notify-github-plugin posts the PR comment / commit status.
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  vrt:
    name: VRT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # reg-keygen-git-hash-plugin walks the git history to find the base
          # commit, so it needs the full history rather than a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Install Playwright (Chromium, software rendering)
        run: npx playwright install --with-deps chromium
      - name: Build Storybook
        run: yarn storybook:build:vrt
      - name: Capture screenshots
        run: yarn vrt:capture
      - name: Run reg-suit
        run: yarn vrt:run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REG_NOTIFY_CLIENT_ID: ${{ vars.REG_NOTIFY_CLIENT_ID }}
      - name: Upload reg-suit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reg-report
          path: .reg/**
          if-no-files-found: ignore
