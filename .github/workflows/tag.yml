# Auto-tags a release when its release PR (chore/release-*, opened by the
# Prepare Release workflow) is merged, so the Publish workflow — which triggers
# on `v*` tags — runs without a manual tag push.
#
# The tag is pushed with a GitHub App token (not GITHUB_TOKEN) on purpose:
# tags created with GITHUB_TOKEN do NOT trigger other workflows, so publish.yml
# would never fire. The App token is the same one Prepare Release uses.
name: Tag Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    name: Tag merged release
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/release-')
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Checkout merge commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: Create and push tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG}; the Publish workflow will run (pending npm-publish approval)."
