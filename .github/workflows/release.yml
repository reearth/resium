name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        description: 'Next version (Use "custom" for specific versions like beta)'
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        required: false
        description: 'Custom version (e.g., 1.19.0-beta.1) - Only used when version is set to "custom"'
        type: string

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - name: Set up git config
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global pull.rebase false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Get current version from package.json
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
      - id: changelog
        name: Generate CHANGELOG
        uses: reearth/changelog-action@2aa0903684eb78de18ed4bd7228c574f550ef52a # main pinned 2026-04-20
        with:
          version: ${{ github.event.inputs.version == 'custom' && github.event.inputs.custom_version || github.event.inputs.version }}
          repo: ${{ github.repository }}
          latest: CHANGELOG_latest.md
          from: v${{ steps.current_version.outputs.current }}
      - name: Upload latest CHANGELOG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-${{ steps.changelog.outputs.version }}
          path: CHANGELOG_latest.md
      - name: Update package.json version
        run: |
          if [ "${{ github.event.inputs.version }}" = "custom" ]; then
            # For custom versions, use the exact version provided
            npm version "${{ github.event.inputs.custom_version }}" --no-git-tag-version
          else
            # For patch/minor/major, let npm calculate the new version
            npm version "${{ github.event.inputs.version }}" --no-git-tag-version
          fi
      - name: Create release branch and PR
        env:
          VERSION: ${{ github.event.inputs.version == 'custom' && github.event.inputs.custom_version || steps.changelog.outputs.version }}
          TAG: ${{ github.event.inputs.version == 'custom' && format('v{0}', github.event.inputs.custom_version) || steps.changelog.outputs.version }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Create release branch
          BRANCH="chore/release-${VERSION}"

          # Delete existing branch if it exists (locally and remotely)
          git branch -D $BRANCH 2>/dev/null || true
          git push origin --delete $BRANCH 2>/dev/null || true

          # Create new release branch
          git checkout -b $BRANCH

          # Remove temporary changelog file
          rm CHANGELOG_latest.md

          # Commit changes (npm version updates package-lock.json too)
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "chore: release ${TAG}"

          # Push branch
          git push origin $BRANCH

          # Create PR
          gh pr create \
            --title "chore: release ${TAG}" \
            --body "$(cat <<EOF
          ## Release ${TAG}

          This PR prepares the release for version ${VERSION}.

          ### Changes
          - Updated version in package.json to ${VERSION}
          - Auto-generated CHANGELOG from commits

          ### Next Steps
          1. Review the CHANGELOG changes
          2. Merge this PR to main — the \`Tag Release\` workflow auto-pushes \`${TAG}\`, which triggers \`publish\`
          3. Approve the \`npm-publish\` environment to publish to npm with provenance

          ---
          🤖 Generated by automated release workflow
          EOF
          )" \
            --base main \
            --head $BRANCH
